<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1677ff" />
    <link rel="manifest" href="manifest.json" />
    <link rel="icon" type="image/png" href="logokp.png" />
    <link rel="apple-touch-icon" href="logokp.png" />
    <title>Test réservation KivuPass</title>
    <style>
        body {
            margin: 0;
            background: #07152f;
            color: #fff;
            font-family: Arial, sans-serif;
            padding: 40px 20px;
        }
        .panel {
            max-width: 700px;
            margin: 0 auto;
            background: #101f3b;
            border: 1px solid #263d64;
            border-radius: 18px;
            padding: 24px;
            box-shadow: 0 10px 30px rgba(0,0,0,.25);
        }
        h1 {
            margin-top: 0;
            color: #1677ff;
        }
        label {
            display: block;
            margin-top: 14px;
            font-size: 14px;
            color: #c8d8f2;
        }
        input, button {
            width: 100%;
            margin-top: 8px;
            padding: 12px 14px;
            border-radius: 10px;
            border: 1px solid #263d64;
            font-size: 15px;
        }
        input {
            background: #07152f;
            color: white;
        }
        button {
            cursor: pointer;
            font-weight: 700;
            background: linear-gradient(135deg, #1677ff, #00d9e8);
            border: none;
            color: white;
            margin-top: 18px;
        }
        button.secondary {
            background: linear-gradient(135deg, #35e548, #16a34a);
        }
        .status {
            margin-top: 20px;
            padding: 14px;
            border-radius: 10px;
            background: #102447;
            border: 1px solid #263d64;
            color: #dfe9f3;
            white-space: pre-wrap;
        }
        .success { color: #7ef0a8; }
        .error { color: #ff8c8c; }
    </style>
</head>
<body>
    <div class="panel">
        <h1>Test de création de réservation</h1>

        <div>
            <label>Nom de la compagnie</label>
            <input id="companyName" value="Test Alpha Voyage" />

            <label>Nom du bateau</label>
            <input id="boatName" value="MV Kivu Express" />

            <label>Nom du niveau</label>
            <input id="levelName" value="VIP" />

            <label>Prix</label>
            <input id="price" value="35" />

            <label>Client</label>
            <input id="client" value="Jean Test" />

            <label>Email</label>
            <input id="email" value="jean.test@example.com" />

            <label>WhatsApp</label>
            <input id="whatsapp" value="243970000000" />
        </div>

        <button id="seedCompanyBtn" class="secondary">Créer la compagnie de test</button>
        <button id="makeReservationBtn">Créer la réservation de test</button>

        <div id="status" class="status">Prêt pour le test.</div>
    </div>

    <script src="common.js"></script>
    <script>
        async function apiRequest(url, options = {}) {
            const response = await fetch(url, {
                headers: { 'Content-Type': 'application/json' },
                ...options
            });
            const data = await response.json();
            if (!response.ok) {
                throw new Error(data.error || 'Erreur serveur');
            }
            return data;
        }

        function setStatus(message, isError = false) {
            const el = document.getElementById('status');
            el.className = 'status ' + (isError ? 'error' : 'success');
            el.textContent = message;
        }

        document.getElementById('seedCompanyBtn').addEventListener('click', async () => {
            const companyName = document.getElementById('companyName').value.trim();
            if (!companyName) {
                setStatus('Le nom de la compagnie est requis.', true);
                return;
            }

            try {
                const payload = {
                    companyName,
                    payments: { orange: '0990000000', airtel: '0970000000', vodacom: '0950000000', africell: '0960000000' },
                    requiredDocs: ['Carte d’identité', 'Certificat médical'],
                    fleet: [{
                        name: document.getElementById('boatName').value.trim() || 'MV Kivu Express',
                        password: 'testpass123',
                        schedule: {},
                        levels: [{
                            label: document.getElementById('levelName').value.trim() || 'VIP',
                            price: Number(document.getElementById('price').value || 35),
                            seats: 10
                        }]
                    }],
                    approved: true
                };

                const result = await apiRequest('api.php?action=companies', {
                    method: 'POST',
                    body: JSON.stringify(payload)
                });

                setStatus('Compagnie créée avec succès.\n' + JSON.stringify(result, null, 2));
            } catch (error) {
                setStatus(error.message, true);
            }
        });

        document.getElementById('makeReservationBtn').addEventListener('click', async () => {
            const companyName = document.getElementById('companyName').value.trim();
            const boatName = document.getElementById('boatName').value.trim();
            const levelName = document.getElementById('levelName').value.trim();
            const price = Number(document.getElementById('price').value || 35);
            const client = document.getElementById('client').value.trim();
            const email = document.getElementById('email').value.trim();
            const whatsapp = document.getElementById('whatsapp').value.trim();

            if (!companyName || !boatName || !levelName || !client || !email) {
                setStatus('Complétez tous les champs requis avant de créer la réservation.', true);
                return;
            }

            try {
                const payload = {
                    client,
                    email,
                    whatsapp,
                    telephone: whatsapp,
                    compagnie: companyName,
                    bateau: boatName,
                    niveau: levelName,
                    prix: price,
                    date: new Date().toLocaleDateString('fr-FR'),
                    heure: new Date().toLocaleTimeString('fr-FR'),
                    statut: 'En attente de validation',
                    docsSoumis: ['Carte d’identité'],
                    payImg: 'data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAF' +
                        'c2R1AAAAAXNSR0IArs4c6QAAAARnQU1BAACxjwv8YQUAAAAJ0UkG' +
                        'AAAAAABJRU5ErkJggg=='
                };

                const result = await apiRequest('api.php?action=reservations', {
                    method: 'POST',
                    body: JSON.stringify(payload)
                });

                setStatus('Réservation créée avec succès.\n' + JSON.stringify(result, null, 2));
            } catch (error) {
                setStatus(error.message, true);
            }
        });
    </script>
</body>
</html>
