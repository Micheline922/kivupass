<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>KivuPass | SUPER ADMIN</title>
    <meta name="theme-color" content="#1677ff">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" href="logokp.png">
    <link rel="apple-touch-icon" href="logokp.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #07152f; color: white; padding: 40px; }
        .card { background: #101f3b; padding: 30px; border-radius: 15px; border: 1px solid #263d64; }
        h1 { color: #1677ff; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { padding: 15px; text-align: left; border-bottom: 1px solid #263d64; }
        .status { padding: 5px 10px; border-radius: 50px; font-size: 12px; }
        .status-pending { background: #92400e; color: #fef3c7; }
        .status-approved { background: #14532d; color: #bbf7d0; }
        .btn { padding: 8px 15px; border-radius: 5px; cursor: pointer; border: none; font-weight: bold; }
        .btn-approve { background: #22c55e; color: white; }
        .btn-reject { background: #ef4444; color: white; margin-left: 5px; }
        #loginPanel { max-width: 420px; margin: 40px auto; }
        #loginPanel input { width: 100%; padding: 12px; margin: 12px 0; box-sizing: border-box; border-radius: 6px; border: 1px solid #263d64; background: #07152f; color: white; }
    </style>
</head>
<body>
    <div id="loginPanel" class="card">
        <h1>Accès sécurisé</h1>
        <p>Cette zone est réservée à l’Administrateur.</p>
        <input id="adminPassword" type="password" autocomplete="current-password" placeholder="Mot de passe super-admin">
        <button class="btn btn-approve" onclick="loginSuperAdmin()">Se connecter</button>
        <p id="loginError"></p>
    </div>
    <div id="adminPanel" class="card" hidden>
        <h1>Contrôle des Accès Armateurs (Super Admin)</h1>
        <button class="btn btn-reject" onclick="logoutSuperAdmin()">Fermer la session</button>
        <table>
            <thead>
                <tr>
                    <th>Compagnie</th>
                    <th>Nb Bateaux</th>
                    <th>Statut</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody id="superAdminTable"></tbody>
        </table>
    </div>

    <script src="common.js"></script>
    <script>
        async function apiRequest(url, options = {}) {
            const response = await fetch(url, { headers: { 'Content-Type': 'application/json' }, ...options });
            const data = await response.json();
            if (!response.ok) throw new Error(data.error || 'Erreur de communication avec le serveur.');
            return data;
        }

        async function renderSuperAdmin() {
            const comps = await apiRequest('api.php?action=companies');
            const table = document.getElementById('superAdminTable');
            table.innerHTML = '';

            comps.forEach(c => {
                table.innerHTML += `
                    <tr>
                        <td><strong>${c.companyName}</strong></td>
                        <td>${c.fleet.length} navire(s)</td>
                        <td><span class="status status-${c.approved ? 'approved' : 'pending'}">${c.approved ? 'Approuvé' : 'En attente'}</span></td>
                        <td>
                            ${!c.approved ? `<button class="btn btn-approve" onclick="toggleApprove(${c.id}, true)">Approuver</button>` : `<button class="btn btn-reject" onclick="toggleApprove(${c.id}, false)">Bloquer</button>`}
                        </td>
                    </tr>
                `;
            });
        }

        async function loginSuperAdmin() {
            try {
                await apiRequest('api.php?action=super-admin-login', {
                    method: 'POST',
                    body: JSON.stringify({ password: document.getElementById('adminPassword').value })
                });
                document.getElementById('loginPanel').hidden = true;
                document.getElementById('adminPanel').hidden = false;
                renderSuperAdmin();
            } catch (error) {
                document.getElementById('loginError').textContent = error.message;
            }
        }

        async function logoutSuperAdmin() {
            await apiRequest('api.php?action=logout', { method: 'POST' });
            document.getElementById('loginPanel').hidden = false;
            document.getElementById('adminPanel').hidden = true;
        }

        async function toggleApprove(id, status) {
            await apiRequest('api.php?action=company-status', {
                method: 'PATCH',
                body: JSON.stringify({ id, approved: status })
            });
            renderSuperAdmin();
        }
        renderSuperAdmin().catch(error => {
            document.getElementById('superAdminTable').innerHTML = `<tr><td colspan="4">${error.message}</td></tr>`;
        });
    </script>
</body>
</html>
